<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Reset Password — Portfolio</title>
<link rel="icon" href="favicon.ico"><link rel="stylesheet" href="css/auth.css">
<script src="js/supabase-config.js"></script>
<script type="module" src="js/password-reset.js"></script>
<link rel="stylesheet" href="css/labo-atmosphere.css?v=warm-room-1">
</head><body><main class="auth-layout">
<a class="back" href="login.html">← 로그인</a>
<section class="auth-card"><p class="eyebrow">GALLERY · ACCOUNT SECURITY</p>
<h1>비밀번호 재설정</h1>
<p id="reset-status" role="status" aria-live="polite">인증 링크를 확인하고 있어요…</p>
<form id="reset-form" hidden>
<label for="new-password">새 비밀번호 (12자 이상)</label>
<input id="new-password" type="password" minlength="12" required autocomplete="new-password">
<label for="repeat-password">새 비밀번호 확인</label>
<input id="repeat-password" type="password" minlength="12" required autocomplete="new-password">
<button type="submit" id="reset-save">비밀번호 변경</button>
</form>
<p class="footnote">본인 이메일로 받은 재설정 링크를 통해서만 진행하세요.</p>
</section></main></body></html>
