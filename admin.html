<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>conect labo · Private Workroom</title>
<link rel="icon" href="favicon.ico"><link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/admin.css"><script src="js/supabase-config.js"></script>
<script type="module" src="js/admin.js"></script>
</head>
<body>
<main class="admin-wrap">
<header class="admin-header"><a href="index.html">← 연구실</a><strong>CONECT LABO / PRIVATE WORKROOM</strong><button id="logout" type="button">로그아웃</button></header>
<p id="admin-status" role="status" aria-live="polite">관리자 권한 확인 중…</p>
<section id="admin-area" hidden>
<div class="admin-heading"><div><p class="eyebrow">THE PRIVATE WORKROOM</p><h1>비공개 작업실</h1><p>작품의 공개 여부와 전시 순서를 관리합니다. 새 작품은 비공개로 시작합니다.</p></div></div>
<div class="admin-grid">
<section class="panel">
<h2>프로젝트 등록·편집</h2>
<form id="project-form">
<label for="p-title">프로젝트 제목 *</label><input id="p-title" maxlength="200" required>
<label for="p-type">유형</label>
<select id="p-type"><option value="marketing">마케팅 캠페인</option><option value="event">행사·이벤트</option><option value="service">서비스·콘텐츠</option></select>
<label for="p-description">요약</label><textarea id="p-description" rows="3" maxlength="3000"></textarea>
<label for="p-content">기획서·본문</label><textarea id="p-content" rows="12"></textarea>
<label for="p-cover">대표 이미지 주소 (선택)</label><input id="p-cover" placeholder="https://…" type="url">
<label for="p-cover-file">대표 이미지 파일 (최대 5MB, JPG/PNG/WebP)</label><input id="p-cover-file" type="file" accept="image/jpeg,image/png,image/webp">
<p class="help">업로드한 이미지는 공개 파일 주소를 사용합니다. 비공개 작업의 민감한 이미지는 올리지 마세요.</p>
<label class="tick"><input id="p-published" type="checkbox"> <span>공개 전시 (방문자에게 노출)</span></label>
<label class="tick"><input id="p-pinned" type="checkbox"> <span>전시실 상단에 고정</span></label>
<div class="actions"><button id="save-project" type="submit">저장하기</button><button type="button" id="new-project" class="secondary">새 프로젝트</button></div>
</form>
</section>
<section class="panel">
<h2>등록된 작품</h2>
<p id="list-status" class="help"></p>
<div id="cloud-list"></div>
<div class="local-import">
<h3>기존 브라우저 프로젝트 가져오기</h3>
<p class="help">기존 브라우저 저장 내용은 삭제하지 않아. 선택한 초안만 비공개 상태로 복사해.</p>
<label for="local-projects">가져올 프로젝트</label><select id="local-projects"><option value="">선택하세요</option></select>
<button type="button" id="import-project" class="secondary">선택한 초안 가져오기</button>
</div>
</section>
</div>
</section>
</main>
</body>
</html>
