<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>My Gallery Account</title>
<link rel="icon" href="favicon.ico"><link rel="stylesheet" href="css/auth.css">
<script src="js/supabase-config.js"></script><script type="module" src="js/mypage.js"></script>
</head>
<body><main class="auth-layout">
<a class="back" href="index.html" data-t="back">← Gallery</a>
<section class="auth-card" aria-labelledby="account-heading">
<p class="eyebrow">MY GALLERY · MEMBER</p>
<h1 id="account-heading" data-t="heading">내 계정</h1>
<p id="my-status" role="status" aria-live="polite" data-t="checking">로그인 확인 중…</p>
<p id="my-email"></p><p id="my-role"></p>
<form id="profile-form" hidden>
<label for="display-name" data-t="name">표시 이름</label>
<input id="display-name" name="display_name" autocomplete="nickname" maxlength="100">
<button type="submit" id="save-name" data-t="save">이름 저장</button>
</form>
<details class="account-details" id="password-details">
<summary data-t="password">비밀번호 변경</summary>
<form id="password-form">
<label for="new-password" data-t="new-password">새 비밀번호 (12자 이상)</label>
<input id="new-password" type="password" minlength="12" autocomplete="new-password" required>
<label for="confirm-password" data-t="confirm-password">새 비밀번호 확인</label>
<input id="confirm-password" type="password" minlength="12" autocomplete="new-password" required>
<button id="save-password" type="submit" data-t="change-password">비밀번호 변경</button>
</form>
</details>
<a id="admin-link" class="back" href="admin.html" hidden data-t="admin">관리자 작품 관리실 열기 →</a>
<button type="button" id="signout" data-t="logout">로그아웃</button>
</section>
</main></body></html>
