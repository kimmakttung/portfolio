<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Gallery Access — Portfolio</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/auth.css">
<script src="js/supabase-config.js"></script>
<script type="module" src="js/auth-page.js"></script>
</head>
<body>
<main class="auth-layout">
<a class="back" href="index.html">← Gallery</a>
<section class="auth-card" aria-labelledby="auth-heading">
<p class="eyebrow">PRIVATE GALLERY · ACCESS</p>
<h1 id="auth-heading">Enter the Gallery</h1>
<p class="intro">회원 로그인 또는 가입 후 나만의 공간을 이용하세요.</p>
<form id="login-form">
<label for="email">이메일</label><input id="email" type="email" autocomplete="email" required>
<label for="password">비밀번호</label><input id="password" type="password" minlength="8" autocomplete="current-password" required>
<label for="display-name" id="name-wrap" hidden>이름<input id="display-name" type="text" maxlength="100" autocomplete="name"></label>
<button type="submit" id="submit-auth">로그인</button>
</form>
<button class="secondary" type="button" id="toggle-auth">계정이 없나요? 회원가입</button>
<div class="divider">또는</div>
<button class="google" id="google-login" type="button">Google 계정으로 계속하기</button>
<p id="auth-message" role="status" aria-live="polite"></p>
<p class="footnote">로그인 기능은 Supabase 프로젝트 연결 후 활성화됩니다.</p>
</section>
</main>
</body>
</html>
