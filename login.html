<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>conect labo — Gallery Access</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/auth.css">
<script src="js/supabase-config.js"></script>
<script type="module" src="js/auth-page.js"></script>
<link rel="stylesheet" href="css/labo-atmosphere.css?v=warm-room-1">
</head>
<body>
<main class="auth-layout">
<a class="back" href="index.html">← Gallery</a>
<section class="auth-card" aria-labelledby="auth-heading">
<p class="eyebrow">CONECT LABO · ACCESS</p>
<h1 id="auth-heading">Enter conect labo</h1>
<p class="intro" id="auth-description">관리자 로그인 · 회원 서비스는 순차적으로 개방합니다.</p>
<form id="login-form">
<label for="email" id="email-label">이메일</label>
<input id="email" type="email" maxlength="254" autocomplete="email" required>
<div id="password-wrap">
<label for="password" id="password-label">비밀번호</label>
<input id="password" type="password" autocomplete="current-password" required>
</div>
<label for="display-name" id="name-wrap" hidden>이름
<input id="display-name" type="text" maxlength="100" autocomplete="name"></label>
<button type="submit" id="submit-auth">로그인</button>
</form>
<button class="secondary" type="button" id="toggle-auth" hidden>계정이 없나요? 회원가입</button>
<button class="secondary" type="button" id="forgot-password" hidden>비밀번호를 잊으셨나요?</button>
<button class="secondary" type="button" id="back-login" hidden>로그인으로 돌아가기</button>
<div id="google-section" hidden>
<div class="divider">또는</div>
<button class="google" id="google-login" type="button">Google 계정으로 계속하기</button>
</div>
<p id="auth-message" role="status" aria-live="polite"></p>
<p class="footnote" id="auth-footnote">일반 회원가입과 Google 로그인은 인증 서비스 설정 후 활성화됩니다.</p>
</section>
</main>
</body>
</html>
